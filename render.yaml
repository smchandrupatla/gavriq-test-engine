# Render Blueprint — GAVRIQ Test Engine (FREE tier)
# Deploy: Dashboard → New → Blueprint → connect this repo → Deploy Blueprint
# Expected URL: https://gavriq-test-engine.onrender.com
#
# Free limits (Render):
#   - Web service spins down after ~15 min idle (cold start ~30–60s)
#   - Free Postgres expires after 30 days unless upgraded
#   - One free Postgres per workspace
# Docs: https://render.com/docs/free

services:
  - type: web
    name: gavriq-test-engine
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gavriq-test-engine-db
          property: connectionString
      - key: PORT
        value: "8787"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: SEED_SANDBENCH
        value: "true"
      - key: RBAC_ENABLED
        value: "false"
      - key: TARGET_BASE_URL
        value: "https://sandbench-web.onrender.com"

databases:
  - name: gavriq-test-engine-db
    plan: free
    databaseName: sitconsole
    user: sitconsole
