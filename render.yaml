# Render Blueprint — GAVRIQ Test Engine
# Deploy: Dashboard → New → Blueprint → connect this repo → Deploy Blueprint
# Service URL will be: https://gavriq-test-engine.onrender.com
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gavriq-test-engine
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gavriq-test-engine-db
          property: connectionString
      - key: PORT
        value: "8787"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: SEED_SANDBENCH
        value: "true"
      - key: RBAC_ENABLED
        value: "false"
      - key: TARGET_BASE_URL
        value: "https://sandbench-web.onrender.com"
      # Optional: set in Dashboard to protect POST /api/v1/ops/seed-sandbench
      - key: SEED_TOKEN
        generateValue: true

databases:
  - name: gavriq-test-engine-db
    plan: basic-256mb
    databaseName: sitconsole
    user: sitconsole
