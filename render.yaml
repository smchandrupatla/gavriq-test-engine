# Render Blueprint — GAVRIQ Test Engine (FREE tier)
#
# Workspace free-Postgres limit: only ONE free database allowed.
# This Blueprint does NOT create a database. Wire DATABASE_URL to your
# existing free Postgres (Dashboard → that DB → Internal Database URL).
#
# Deploy: Blueprint → Manual sync after this commit, or re-sync.
# URL: https://gavriq-test-engine.onrender.com
#
# Free web limits: sleeps after ~15 min idle; cold start ~30–60s.

services:
  - type: web
    name: gavriq-test-engine
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Paste Internal Database URL from your existing free Postgres in Render.
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "8787"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: SEED_SANDBENCH
        value: "true"
      - key: RBAC_ENABLED
        value: "false"
      - key: TARGET_BASE_URL
        value: "https://sandbench-web.onrender.com"
