# Render Blueprint — GAVRIQ Test Engine (FREE tier)
#
# Resources:
#   - Web: gavriq-test-engine  (plan: free)
#   - DB:  gavriq-test-engine-db (plan: free)
#
# IMPORTANT — Render allows only ONE free Postgres per workspace.
# If sync fails with "cannot have more than one active free tier database":
#   1. Dashboard → delete or upgrade your other free Postgres, OR
#   2. Keep that DB and set DATABASE_URL manually (remove databases: below).
#
# After successful sync:
#   https://gavriq-test-engine.onrender.com
#   /health  /catalog/  /api/v1/ops/catalog-counts
#
# Free limits: web sleeps ~15 min idle; free Postgres expires after 30 days.

services:
  - type: web
    name: gavriq-test-engine
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gavriq-test-engine-db
          property: connectionString
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: SEED_SANDBENCH
        value: "true"
      - key: RBAC_ENABLED
        value: "false"
      - key: TARGET_BASE_URL
        value: "https://sandbench-web.onrender.com"

databases:
  - name: gavriq-test-engine-db
    plan: free
    databaseName: sitconsole
    user: sitconsole
