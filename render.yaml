# Render Blueprint — GAVRIQ Test Engine (FREE tier)
#
# BEFORE deploy succeeds you MUST set DATABASE_URL in the service Environment:
#   Dashboard → gavriq-test-engine → Environment → DATABASE_URL
#   = Internal Database URL from your existing free Postgres
#
# Then: Manual Deploy → Deploy latest commit
# URL: https://gavriq-test-engine.onrender.com
#
# Free limits: sleeps after ~15 min idle; cold start ~30–60s.
# First Docker build can take 10–20+ minutes (Playwright base image).

services:
  - type: web
    name: gavriq-test-engine
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Required — set in Dashboard (Internal URL from existing free Postgres).
      - key: DATABASE_URL
        sync: false
      # Do NOT set PORT — Render injects it; app listens on process.env.PORT.
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: SEED_SANDBENCH
        value: "true"
      - key: RBAC_ENABLED
        value: "false"
      - key: TARGET_BASE_URL
        value: "https://sandbench-web.onrender.com"
