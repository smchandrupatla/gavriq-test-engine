# Render Blueprint — GAVRIQ Test Engine (FREE tier)
#
# ONE free Postgres instance for the whole workspace:
#   - Sand Bench web  → schema `app` (or `public`)  [configure on that service]
#   - Test Engine     → schema `test_engine`         [PG_SCHEMA below]
#
# Do NOT create a second free database. Set DATABASE_URL to the existing
# free Postgres Internal Database URL (same URL Sand Bench uses).
#
# After deploy: https://gavriq-test-engine.onrender.com
#
# Free limits: web sleeps ~15 min idle; free Postgres expires after 30 days.

services:
  - type: web
    name: gavriq-test-engine
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Same free Postgres instance as Sand Bench web (Internal Database URL).
      - key: DATABASE_URL
        sync: false
      # All Test Engine tables/enums live under this schema (not public/app).
      - key: PG_SCHEMA
        value: test_engine
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: SEED_SANDBENCH
        value: "true"
      - key: RBAC_ENABLED
        value: "false"
      - key: TARGET_BASE_URL
        value: "https://sandbench-web.onrender.com"
