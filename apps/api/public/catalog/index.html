<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAVRIQ Test Engine</title>
<style>
:root{
  --bg:#0c1420; --panel:#101a29; --panel2:#0e1826; --line:#1f2b3d; --line-soft:#1a2434;
  --text:#eef1f5; --muted:#7c8aa0; --muted2:#5a6a80;
  --gold:#e0ab52; --gold-soft:#2a2214; --gold-text:#f0c96a;
  --green:#2dd4bf; --green-soft:#0d2a28; --red:#ff6b6b; --red-soft:#3a1a1a;
  --amber:#e8b84b; --amber-soft:#3a2c11; --blue:#6fb3e0; --blue-soft:#152433;
  /* Chart + tile marks. Validated on --panel/--panel2: CVD-safe pass/fail pair, >=3:1 contrast. */
  --viz-pass:#12a594; --viz-fail:#e5484d; --viz-other:#6b7a90; --viz-never:#34445a; --viz-rate:#6fb3e0;
  --grid:#1a2536; --axis:#2e3e57;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,Segoe UI,system-ui,sans-serif}
a{color:var(--gold-text);text-decoration:none}a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
.shell{display:flex;min-height:100vh}
.sidebar{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line)}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#1e3a5f);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:0 0 auto;font-size:12px}
.brand-title{font-weight:600;font-size:15px}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.side-nav{flex:1;padding:10px 8px}
.nav-section{margin:14px 6px 6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2)}
.nav-sec{display:flex;align-items:center;gap:6px;width:100%;margin:12px 0 2px;padding:4px 8px;background:transparent;border:none;cursor:pointer;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);text-align:left}
.nav-sec:hover{color:var(--text)}
.nav-sec .nav-caret{font-size:9px;width:10px;flex:0 0 auto}
.nav-sec .nav-label{flex:1}
.nav-group[hidden]{display:none}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:6px;border:none;background:transparent;color:var(--text);cursor:pointer;font-size:13px}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--gold-soft);color:var(--gold-text)}
.nav-item.active-sit{background:var(--blue-soft);color:var(--blue)}
.nav-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--muted2)}
.nav-dot.green{background:var(--green)}.nav-dot.red{background:var(--red)}.nav-dot.amber{background:var(--amber)}.nav-dot.blue{background:var(--blue)}
.nav-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{font-size:11px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:1px 7px}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0;flex:0 0 auto}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:6px;width:34px;height:34px;cursor:pointer;display:none}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
input[type=search],input[type=date],input[type=datetime-local],input[type=number],input[type=text],select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
input[type=date],input[type=datetime-local]{color-scheme:dark}
#globalSearch{width:220px}
.pill{font-size:11px;padding:4px 9px;border-radius:12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--green);border-color:var(--green-soft)}.pill.bad{color:var(--red);border-color:var(--red-soft)}
.banner{margin:0 22px;padding:10px 14px;border-radius:8px;background:var(--amber-soft);border:1px solid #5a431a;color:var(--amber);font-size:13px}
.content{padding:22px;flex:1}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.app-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.app-tile{display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.app-tile:hover{border-color:var(--gold);border-left-color:var(--gold);background:var(--panel2);transform:translateY(-1px)}
.app-tile.tone-green{border-left-color:var(--green)}
.app-tile.tone-red{border-left-color:var(--red)}
.app-tile.tone-amber{border-left-color:var(--amber)}
.app-tile.tone-never{border-left-color:var(--muted2)}
.app-tile-head .app-tile-title{font-size:16px;font-weight:600}
.app-tile-head .app-tile-sub{font-size:11px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;margin-top:2px}
.app-tile-kpis{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.app-tile-kpis b{color:var(--text);font-weight:600}
.app-tile-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi-value{font-size:24px;font-weight:600;margin-top:4px}
.kpi-value.green{color:var(--green)}.kpi-value.red{color:var(--red)}.kpi-value.amber{color:var(--amber)}.kpi-value.blue{color:var(--blue)}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.card-head h2{font-size:14px;margin:0;font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--gold)}.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--gold);color:#1b1608;border-color:var(--gold);font-weight:600}
.btn.sit{background:var(--blue);color:#0c1420;border-color:var(--blue);font-weight:600}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel)}
tbody tr:hover{background:var(--panel2)}
td.key,.key{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.case-name{background:none;border:none;color:var(--gold-text);cursor:pointer;font:inherit;text-align:left;padding:0}
.case-name:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.passed{background:var(--green-soft);color:var(--green)}
.badge.failed,.badge.error,.badge.timed_out{background:var(--red-soft);color:var(--red)}
.badge.running,.badge.queued,.badge.preparing,.badge.claiming{background:var(--amber-soft);color:var(--amber)}
.badge.skipped,.badge.blocked,.badge.cancelled,.badge.never{background:var(--panel2);color:var(--muted)}
.badge.sit{background:var(--blue-soft);color:var(--blue)}
.tag{font-size:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:1px 6px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}.muted{color:var(--muted)}.small{font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}.nowrap{white-space:nowrap}
tr.clickable{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.more{display:flex;align-items:center;gap:12px;padding:12px 16px}
.kpi-value.sm{font-size:15px;margin-top:8px;font-family:ui-monospace,Consolas,monospace}
/* Skeleton only on first paint; refetches keep the previous frame. */
.skel{border:1px solid var(--line);border-radius:10px;height:118px;background:linear-gradient(90deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:300% 100%;animation:shimmer 1.3s ease infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
/* Status tiles */
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.group-head.first{margin-top:0}
.group-head h2{font-size:12px;margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tone-pass{--tone:var(--viz-pass);--tone-bg:rgba(18,165,148,.07)}
.tone-fail{--tone:var(--viz-fail);--tone-bg:rgba(229,72,77,.08)}
.tone-warn{--tone:var(--amber);--tone-bg:rgba(232,184,75,.06)}
.tone-never{--tone:var(--viz-other);--tone-bg:transparent}
.tone-empty{--tone:var(--line);--tone-bg:transparent}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.stile{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;padding:12px 14px 12px 17px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(var(--tone-bg),var(--tone-bg)),var(--panel);color:inherit;font:inherit;cursor:pointer;overflow:hidden;transition:border-color .15s}
.stile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone)}
.stile:hover{border-color:var(--tone)}
.stile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stile.open{border-color:var(--tone);box-shadow:inset 0 0 0 1px var(--tone)}
.stile.tone-never{border-style:dashed}.stile.tone-never::before{background:repeating-linear-gradient(180deg,var(--viz-other) 0 5px,transparent 5px 9px)}
.stile.tone-empty{opacity:.55}
.stile.is-running{box-shadow:inset 0 0 0 1px rgba(111,179,224,.55),0 0 0 2px rgba(111,179,224,.35),0 0 18px 2px rgba(111,179,224,.35);animation:tile-glow 1.6s ease-in-out infinite}
@keyframes tile-glow{0%,100%{box-shadow:inset 0 0 0 1px rgba(111,179,224,.55),0 0 0 2px rgba(111,179,224,.35),0 0 18px 2px rgba(111,179,224,.35)}50%{box-shadow:inset 0 0 0 1px rgba(111,179,224,.9),0 0 0 2px rgba(111,179,224,.7),0 0 28px 4px rgba(111,179,224,.6)}}
.pbar-facts{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.pbar-facts>span{display:flex;flex-direction:column;gap:2px;min-width:140px;padding:6px 10px;background:var(--bg-sub,rgba(255,255,255,.03));border-radius:6px}
.pbar-rules{margin-top:10px;padding:8px 10px;background:var(--bg-sub,rgba(255,255,255,.03));border-radius:6px}
.pbar-rules .rule-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.pbar-rules .rule-chips{display:flex;gap:8px;flex-wrap:wrap}
.rule-chip{display:inline-flex;flex-direction:column;gap:2px;padding:4px 10px;border-radius:12px;border:1px solid var(--border,rgba(255,255,255,.1));font-size:12px}
.rule-chip b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.rule-chip.rule-pass{background:rgba(70,160,100,.12);border-color:rgba(70,160,100,.5);color:var(--green,#5bb97d)}
.rule-chip.rule-warn{background:rgba(220,170,70,.12);border-color:rgba(220,170,70,.5);color:var(--amber,#d8ab46)}
.rule-chip.rule-fail{background:rgba(220,80,80,.12);border-color:rgba(220,80,80,.6);color:var(--red,#e36b6b)}
.rule-chip.rule-muted{opacity:.75}
.stile-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.stile-title{font-weight:600;font-size:13px;line-height:1.35;min-width:0}
.stile-counts{font-size:12px;color:var(--muted)}.stile-counts b{color:var(--text);font-size:16px;font-weight:600}
.stile-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted2)}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;background:var(--panel2);color:var(--muted);vertical-align:2px}
.chip-pass{background:var(--green-soft);color:var(--green)}.chip-fail{background:var(--red-soft);color:var(--red)}.chip-warn{background:var(--amber-soft);color:var(--amber)}
.meter{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;background:var(--panel2)}
.meter .seg{display:block;min-width:3px;flex-basis:0}
.seg.pass{background:var(--viz-pass)}.seg.fail{background:var(--viz-fail)}.seg.other{background:var(--viz-other)}.seg.never{background:var(--viz-never)}
.tone-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin:2px 0 -8px}
.tone-legend span{display:inline-flex;align-items:center;gap:6px}
.tone-legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--tone)}
.tone-legend .sw.tone-never{background:transparent;border:1px dashed var(--viz-other)}
/* Live indicators */
.pulse{display:inline-block;flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--blue);animation:ping 1.6s ease-out infinite}
.pulse.queued,.pulse.preparing,.pulse.claiming{background:var(--amber);animation:none}
.pulse.idle{background:var(--muted2);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(111,179,224,.6)}100%{box-shadow:0 0 0 8px rgba(111,179,224,0)}}
.nav-dot.pulse-dot{animation:ping 1.6s ease-out infinite}
.live-chip{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:600}
.pill .pulse{margin-right:6px;vertical-align:0}
.live-board{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));margin-bottom:22px}
.live-card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:12px 14px;cursor:pointer;min-width:0}
.live-card:hover,.live-card:focus-visible{border-color:var(--blue);outline:none}
.live-card.stalled{border-left-color:var(--amber)}
.live-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.run-key{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--gold-text)}.run-key.big{font-size:15px}
.live-elapsed{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text);font-size:13px}
.live-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}.live-meta b{color:var(--text)}
.live-now{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}.live-now b{color:var(--text)}
.stall{padding:3px 8px;border-radius:6px;background:var(--amber-soft);color:var(--amber);font-size:12px}
.counts{display:inline-flex;flex-wrap:wrap;gap:2px 12px}
.kdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.kdot.pass{background:var(--viz-pass)}.kdot.fail{background:var(--viz-fail)}.kdot.other{background:var(--viz-other)}
.progress-seg{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--panel2);margin:10px 0 8px}
.progress-seg.big{height:12px;border-radius:6px}.progress-seg.thin{height:6px;margin:0}
.progress-seg>span{display:block;min-width:2px;transition:flex-grow .4s ease}
.progress-seg .pass{background:var(--viz-pass)}.progress-seg .fail{background:var(--viz-fail)}.progress-seg .other{background:var(--viz-other)}
.progress-seg .rest{background:transparent}
.progress-seg .rest.running{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(111,179,224,.2) 6px 12px);background-size:17px 17px;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:17px 0}}
.live-strip{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.ls-item{display:grid;grid-template-columns:auto auto 1fr minmax(80px,200px) auto;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:var(--blue-soft);border:1px solid #1f3a52;color:var(--text)}
.ls-item:hover{text-decoration:none;border-color:var(--blue)}
@media(max-width:700px){.ls-item{grid-template-columns:auto 1fr auto}.ls-item .progress-seg,.ls-item .muted{display:none}}
tr.row-running td{background:rgba(111,179,224,.06)}
.badge .pulse{width:6px;height:6px}
/* History panel */
.hp{margin-top:12px}
.hp .card-head h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hp-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hp-body{padding:14px 16px}
.hp-body.refreshing{opacity:.6;transition:opacity .2s}
.hp-loading{display:grid;gap:12px}
.hp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;min-width:0}
.stat-label{font-size:11px;color:var(--muted)}.stat-value{font-size:22px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}.stat-sub{font-size:11px;color:var(--muted2);margin-top:2px}
.hp-charts{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
@media(max-width:980px){.hp-charts{grid-template-columns:minmax(0,1fr)}}
figure.viz{margin:0;background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;min-width:0}
figure.viz figcaption{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:600;margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-weight:400;color:var(--muted);font-size:11px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart{position:relative;min-height:176px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--grid);stroke-width:1}.chart .axis{stroke:var(--axis);stroke-width:1}
.chart text{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.chart .end-label{fill:var(--text);font-weight:600;font-size:11px}
.chart .col.hot .mark{filter:brightness(1.25)}
.chart .hit{fill:transparent;outline:none}.chart .hit.link{cursor:pointer}
.chart .col .hit:focus-visible{fill:rgba(224,171,82,.08)}
.chart .line{fill:none;stroke:var(--viz-rate);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--viz-rate);opacity:.1}
.chart .dot{fill:var(--viz-rate);stroke:var(--panel2);stroke-width:2}
.chart .cross{stroke:var(--axis);stroke-width:1}
.viz-tip{position:absolute;pointer-events:none;background:#0a111c;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:11.5px;min-width:140px;box-shadow:0 6px 18px #0009;z-index:3;white-space:nowrap}
.viz-tip-title{color:var(--muted);margin-bottom:4px}
.viz-tip-row{display:flex;align-items:center;gap:6px}.viz-tip-row b{min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.viz-key{display:inline-block;width:10px;height:2px;border-radius:1px}
.top-fail{margin-top:14px}.top-fail h3,.dlg-h{font-size:12px;margin:0 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.top-fail ol{margin:0;padding-left:20px;display:grid;gap:4px}.top-fail li{font-size:13px}.top-fail li>*{margin-right:8px}
details{margin-top:14px}details summary{cursor:pointer;font-size:12px;color:var(--muted)}details .table-wrap{margin-top:8px;border:1px solid var(--line-soft);border-radius:8px}
/* Run screen */
.run-body{padding:4px 16px 14px}
.run-kv{grid-template-columns:repeat(auto-fill,minmax(84px,100px) minmax(160px,1fr));margin:12px 0 0}
.run-cases{list-style:none;margin:0;padding:0}
.run-case{display:grid;grid-template-columns:22px minmax(0,1fr) auto 52px;gap:10px;align-items:start;padding:10px 16px;border-bottom:1px solid var(--line-soft)}
.run-case.running{background:rgba(111,179,224,.07)}
.run-case.pending .case-name{color:var(--muted)}
.rc-icon{width:18px;height:18px;margin-top:1px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.rc-icon.passed{background:var(--green-soft);color:var(--green)}.rc-icon.failed{background:var(--red-soft);color:var(--red)}
.rc-icon.pending{border:1px dashed var(--muted2)}.rc-icon.other{background:var(--panel2);color:var(--muted)}
.rc-icon.running{border:2px solid var(--blue);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rc-msg{font-size:12px;color:var(--muted);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:6em;overflow:auto}
.rc-dur{text-align:right;font-variant-numeric:tabular-nums}
.small-btn{padding:3px 8px;font-size:12px;margin-top:6px}
.evidence{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.evidence img{max-height:120px;max-width:100%;border-radius:6px;border:1px solid var(--line)}
.evidence-item{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.copy-btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer}
.copy-btn:hover{border-color:var(--gold);color:var(--text)}.copy-btn:disabled{opacity:.6;cursor:default}
.mini-runs{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:4px}.mini-runs a{display:flex;gap:10px;align-items:center;color:var(--text)}
a.toast{display:block}a.toast:hover{text-decoration:none;border-color:var(--gold-text)}
@media (prefers-reduced-motion: reduce){.pulse,.nav-dot.pulse-dot,.skel,.rc-icon.running,.progress-seg .rest.running{animation:none}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin-bottom:12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.kv dd a{color:var(--gold-text)}
/* Case detail tabs */
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
.tab-btn{background:none;border:none;color:var(--muted);padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;cursor:pointer;font:inherit;font-size:13px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--gold-text);border-bottom-color:var(--gold)}
/* Run tiles (case detail "Runs" tab) */
.run-tiles{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px}
.run-tile{display:flex;flex-direction:column;gap:6px;min-width:180px;flex:1 1 200px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:inherit;font:inherit;cursor:pointer}
.run-tile:hover{border-color:var(--gold)}
.run-tile-name{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.run-case-bar{display:flex;gap:8px;align-items:center;margin-top:4px}
.field-error{color:var(--red);font-size:12px;margin-top:8px}
/* Overview: staged deploy → run → teardown progress bar */
.pbar-wrap{margin:-2px 0 14px}
.pbar{display:flex;align-items:stretch;flex-wrap:wrap;gap:0}
.pstage{position:relative;flex:1 1 160px;min-width:130px;text-align:left;border:1px solid var(--line);background:var(--panel2);color:inherit;font:inherit;cursor:pointer;padding:0;border-radius:8px;overflow:hidden}
.pstage:hover{border-color:var(--gold)}
.pstage.open{outline:2px solid var(--blue);outline-offset:-1px}
.pstage .seg-fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--amber) 28%,transparent);z-index:0}
.pstage-body{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px;padding:8px 12px}
.pstage-body b{font-size:13px}
.pstage-label{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstage-arrow{align-self:center;color:var(--muted2);padding:0 4px;font-size:18px}
.pstage-pass{border-left:4px solid var(--green)}
.pstage-fail{border-left:4px solid var(--red)}
.pstage-warn{border-left:4px solid var(--amber)}
.pstage-idle{border-left:4px solid var(--line)}
.pstage.st-pending{opacity:.55}
.pbar-detail{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.pbar-detail-head{font-size:13px;margin-bottom:6px}
.pbar-log{white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;margin:4px 0 0;padding:8px 10px;background:var(--panel2);border-radius:6px;font-size:12px;line-height:1.4}
@media(max-width:700px){.pbar{flex-direction:column}.pstage-arrow{display:none}}
/* Overview: run-by-type multi-select */
.type-check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 14px}
.type-check{display:flex;align-items:center;gap:6px;font-size:13px}
.type-check input:disabled{opacity:.5}
/* Forms (Schedule runs, Reports) */
.form-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 14px;align-items:start;padding:10px 16px;border-bottom:1px solid var(--line-soft)}
.form-row:last-child{border-bottom:none}
.form-label{color:var(--muted);font-size:12px;padding-top:7px}
.radio-row{display:flex;flex-wrap:wrap;gap:6px 18px;padding-top:6px}
.report-scope ul{margin:6px 0 0;padding-left:18px;font-size:13px}.report-scope{border-left:3px solid var(--gold)}
@media(max-width:700px){.form-row{grid-template-columns:1fr}.form-label{padding-top:0}}
/* Quality insights (insights.js) */
.qi-top{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.qi-two,.hp-charts.qi-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hp-charts.qi-even{gap:14px;align-items:start}
@media(max-width:980px){.qi-top,.qi-two,.hp-charts.qi-even{grid-template-columns:minmax(0,1fr)}}
.qi-verdict-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qi-headline{font-size:18px;line-height:1.35;margin:0 0 10px;font-weight:600}
.qi-verdict p,.qi-review p,.qi-finding p,.qi-suggest p,.qi-two p{margin:0 0 8px;max-width:78ch}
.qi-hero{display:flex;align-items:baseline;gap:8px}
.qi-hero-value{font-size:52px;font-weight:600;line-height:1}.qi-hero-of{color:var(--muted);font-size:16px}
.qi-components{display:grid;gap:10px;margin-top:14px}
.qi-comp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.qi-comp-label{font-size:13px}.qi-comp-value{font-weight:600;font-variant-numeric:tabular-nums}
.qi-comp-basis{grid-column:1/-1}
/* Meter: the fill carries severity, the track is a lighter step of the same hue. */
.qi-meter{grid-column:1/-1;display:block;height:6px;border-radius:3px;overflow:hidden}
.qi-meter i{display:block;height:100%;border-radius:3px}
.qi-meter.pass{background:rgba(18,165,148,.18)}.qi-meter.pass i{background:var(--viz-pass)}
.qi-meter.warn{background:rgba(232,184,75,.18)}.qi-meter.warn i{background:var(--amber)}
.qi-meter.fail{background:rgba(229,72,77,.2)}.qi-meter.fail i{background:var(--viz-fail)}
.qi-delta{font-size:11px;color:var(--muted)}.qi-delta.good{color:var(--green)}.qi-delta.bad{color:var(--red)}
.qi-hash{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--text)}
.chart.qi-chart{min-height:0}
.qi-note{margin:-2px 0 6px}
.qi-activity{margin-top:14px}
.qi-envs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr));gap:16px;margin:16px 0}
.qi-envs .card{margin-bottom:0}.qi-env.retired{opacity:.72}
.qi-env .hp-stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.qi-build{margin-bottom:12px;font-size:13px}.qi-warn{color:var(--amber)}
.qi-envmeter{margin:6px 0;height:8px}
.qi-sub{margin-top:10px;font-size:12px}
.qi-builds{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px}.qi-builds li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.qi-review{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.qi-list{margin:0 0 8px;padding-left:18px;display:grid;gap:4px;max-width:82ch}
.qi-list.evidence{color:var(--muted);font-size:12px}
.qi-findings,.qi-suggest{list-style:none;margin:0;padding:0}
.qi-finding{padding:14px 16px;border-bottom:1px solid var(--line-soft)}.qi-finding:last-child{border-bottom:none}
.qi-finding-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qi-finding .chip{text-transform:capitalize}
.qi-keys{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.qi-suggest li{padding:10px 0;border-bottom:1px solid var(--line-soft)}.qi-suggest li:last-child{border-bottom:none}
.qi-suggest+.dlg-h{margin-top:14px}
.qi-notice{border-left:3px solid var(--amber)}.qi-pending{border-left:3px solid var(--blue)}
.tabs.qi-tabs{flex-wrap:wrap;gap:0 16px}
.qi-pair{display:inline-flex;gap:6px;align-items:center;margin-right:12px}
.toast-wrap{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 14px;border-radius:8px;font-size:13px;max-width:340px;box-shadow:0 6px 20px #0008}
@media(max-width:860px){.topbar{position:static}#livePill{display:none}.icon-btn{display:inline-block}.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .18s ease}.sidebar.open{transform:translateX(0)}#globalSearch{width:140px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/home" title="Home — pick an application" style="text-decoration:none;color:inherit">
      <div class="brand-mark">TE</div>
      <div>
        <div class="brand-title">GAVRIQ Test Engine</div>
        <div class="brand-sub">Unified console</div>
      </div>
    </a>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="sidebar-foot">One URL · dashboard · catalog · SIT</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
      <h1 id="viewTitle">Overview</h1>
      <div class="topbar-actions">
        <input id="globalSearch" type="search" placeholder="Search cases…" aria-label="Search">
        <label class="pill" style="border:none;background:none;padding-right:0">App</label>
        <select id="appSelect" aria-label="Application under test"></select>
        <label class="pill" style="border:none;background:none;padding-right:0">Env</label>
        <select id="envSelect" aria-label="Target environment"></select>
        <label class="pill" style="border:none;background:none;padding-right:0" title="Branch / tag / version to run against. Stamped on every run queued from this console (Run everything, Run suite, Run case, Schedule) and shown in the App version column.">Version</label>
        <input id="appVersionInput" type="text" list="appVersionList" value="main" style="width:140px;padding:4px 8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;font:inherit" aria-label="Application version / branch">
        <datalist id="appVersionList"></datalist>
        <label class="pill" id="headedToggle" title="Run browser-based tests with a visible window instead of headless"><input type="checkbox" id="headedCheck"> Show browser</label>
        <span id="livePill" class="pill" title="Live status poll">connecting…</span>
        <span id="workerPill" class="pill">workers —</span>
        <span id="healthPill" class="pill">checking…</span>
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="/catalog/charts.js"></script>
<script src="/catalog/insights.js"></script>
<script src="/catalog/testbench.js"></script>
<script src="/catalog/app.js"></script>
</body>
</html>
