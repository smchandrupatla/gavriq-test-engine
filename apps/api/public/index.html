<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAVRIQ Test Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: '#0f1419', card: '#1a2332', border: '#2d3a4f', inset: '#121924' },
            accent: { DEFAULT: '#3b82f6', soft: '#1e3a5f' }
          },
          fontFamily: {
            sans: ['"IBM Plex Sans"', 'ui-sans-serif', 'system-ui'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html { color-scheme: dark; }
    body { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .nav-btn.active { background: #1e3a5f; color: #93c5fd; border-color: #3b82f6; }
    .card-row { border-left: 3px solid #2d3a4f; }
    .card-row:hover { border-left-color: #3b82f6; }
    .card-row.picked { border-left-color: #3b82f6; background: rgba(30,58,95,.35); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #2d3a4f; border-radius: 8px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body class="bg-surface text-slate-200 min-h-screen">
  <div class="min-h-screen flex">
    <aside class="w-60 shrink-0 bg-surface-card border-r border-surface-border flex flex-col sticky top-0 h-screen">
      <div class="px-4 py-4 border-b border-surface-border flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center font-semibold text-white text-sm" aria-hidden="true">TE</div>
        <div>
          <p class="text-sm font-semibold leading-tight">GAVRIQ</p>
          <p class="text-[11px] text-slate-400 leading-tight">Test Engine</p>
        </div>
      </div>
      <nav class="p-3 space-y-1 flex-1 overflow-y-auto" aria-label="Main">
        <p class="px-2 pt-1 pb-1 text-[10px] uppercase tracking-wider text-slate-500">Workspace</p>
        <button class="nav-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-surface-border/60" data-nav="overview">Overview</button>
        <button class="nav-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-surface-border/60" data-nav="catalog">Test catalog</button>
        <button class="nav-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-surface-border/60" data-nav="sit">SIT test cases</button>
        <button class="nav-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-surface-border/60" data-nav="cases">Test cases</button>
        <p class="px-2 pt-3 pb-1 text-[10px] uppercase tracking-wider text-slate-500">Operations</p>
        <button class="nav-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-surface-border/60" data-nav="schedules">Schedules</button>
        <button class="nav-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-surface-border/60" data-nav="runs">Test runs</button>
        <button class="nav-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-surface-border/60" data-nav="log">Test kit log</button>
        <button class="nav-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-surface-border/60" data-nav="workers">Workers &amp; builds</button>
      </nav>
      <div class="p-3 border-t border-surface-border text-[11px] text-slate-500 space-y-1">
        <p>Unified console · :8787</p>
        <p>Legacy SIT portal remains on :8098</p>
      </div>
    </aside>
    <div class="flex-1 min-w-0 flex flex-col">
      <header class="border-b border-surface-border bg-surface-card/80 backdrop-blur sticky top-0 z-10">
        <div class="px-5 py-3 flex items-center justify-between gap-4">
          <div>
            <h1 id="pageTitle" class="text-lg font-semibold tracking-tight">Overview</h1>
            <p id="pageSub" class="text-xs text-slate-400">Repository · SIT catalog · schedules · evidence</p>
          </div>
          <div class="flex items-center gap-2 text-xs">
            <span id="healthBadge" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-700 text-slate-300">checking…</span>
            <button onclick="refreshAll()" class="px-3 py-1.5 rounded bg-surface border border-surface-border hover:bg-surface-border transition">Refresh</button>
          </div>
        </div>
      </header>
      <main id="view" class="flex-1 px-5 py-5 space-y-5"></main>
    </div>
  </div>
  <script src="/console-ui.js"></script>
  <script src="/console-pages.js"></script>
  <script src="/console.js"></script>
</body>
</html>
