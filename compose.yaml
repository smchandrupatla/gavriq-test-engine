name: gavriq-test-engine

services:
  sit-console-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitconsole
      POSTGRES_USER: sitconsole
      POSTGRES_PASSWORD: sitconsole
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitconsole -d sitconsole"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sit-console-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  test-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: gavriq-test-engine:local
    depends_on:
      sit-console-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sitconsole:sitconsole@sit-console-db:5432/sitconsole
      PORT: "8787"
      HOST: "0.0.0.0"
      API_INTERNAL_PORT: "18787"
      SIT_INTERNAL_PORT: "18098"
      RBAC_ENABLED: "false"
      AUTO_SEED: "true"
      TARGET_BASE_URL: ${TARGET_BASE_URL:-http://host.docker.internal:8001}
      EVIDENCE_DIR: /data/evidence
      LOG_DIR: /var/log/sandbench
      LOG_SERVICE: sit-console
      SIT_CONSOLE_STORE: /data/history.json
      SIT_API_BASE: ${SIT_CONSOLE_SIT_API_BASE:-http://host.docker.internal:8787}
      SIT_DBVIEWER_BASE: ${SIT_CONSOLE_SIT_DBVIEWER_BASE:-http://host.docker.internal:8090}
      SIT_DEFAULT_SUITES: health,gui,security
      SIT_ON_START: "false"
      SIT_TESTHUB_BASE: ${SIT_CONSOLE_SIT_TESTHUB_BASE:-http://host.docker.internal:8091}
      SIT_WEB_BASE: ${SIT_CONSOLE_SIT_WEB_BASE:-http://host.docker.internal:8080}
      # "Kafka test" menu: Kafka Desk by its alias on the shared network (see docs/KAFKA-TEST.md)
      SIT_KAFKA_DESK_BASE: ${SIT_KAFKA_DESK_BASE:-http://kafka-desk:8095}
      SIT_KAFKA_DESK_USER: ${SIT_KAFKA_DESK_USER:-}
      SIT_KAFKA_DESK_PASS: ${SIT_KAFKA_DESK_PASS:-}
      SIT_KAFKA_FEEDER_MESSAGES: ${SIT_KAFKA_FEEDER_MESSAGES:-6}
      SIT_KAFKA_FEEDER_SECONDS: ${SIT_KAFKA_FEEDER_SECONDS:-12}
      SIT_KAFKA_LOAD_MESSAGES: ${SIT_KAFKA_LOAD_MESSAGES:-200}
      SIT_KAFKA_LOAD_FEEDER_SECONDS: ${SIT_KAFKA_LOAD_FEEDER_SECONDS:-10}
    networks:
      default: {}
      kafka-shared: {}
    ports:
      - "127.0.0.1:${TEST_ENGINE_HOST_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - test-engine-evidence:/data/evidence
      - sit-console-data:/data
      - sandbench-logs:/var/log/sandbench
      - type: bind
        source: ./apps/logging
        target: /opt/sbe-logging
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all(['http://127.0.0.1:8787/health','http://127.0.0.1:8787/sit/health'].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u)}))).then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  test-engine-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: gavriq-test-engine-worker:local
    command: ["npx", "tsx", "apps/worker/src/worker.ts"]
    depends_on:
      test-engine:
        condition: service_healthy
    environment:
      TEST_ENGINE_API: http://test-engine:8787
      TARGET_BASE_URL: ${TARGET_BASE_URL:-http://host.docker.internal:8080}
      WORKER_POLL_MS: "4000"
      WORKER_API_KEY: ${WORKER_API_KEY:-}
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      EVIDENCE_DIR: /data/evidence
    volumes:
      - test-engine-evidence:/data/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "256mb"
    restart: unless-stopped
    profiles:
      - workers

  sit:
    build:
      context: .
      dockerfile: sit/Dockerfile
    image: gavriq-test-engine-sit:local
    command: ["node", "sit/run.mjs"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SIT_API_BASE: ${SIT_SIT_API_BASE:-http://host.docker.internal:8787}
      SIT_DBVIEWER_BASE: ${SIT_SIT_DBVIEWER_BASE:-http://host.docker.internal:8090}
      SIT_TESTHUB_BASE: ${SIT_SIT_TESTHUB_BASE:-http://host.docker.internal:8091}
      SIT_WEB_BASE: ${SIT_SIT_WEB_BASE:-http://host.docker.internal:8080}
    profiles:
      - sit

networks:
  kafka-shared:
    name: gavriq-kafka-net

volumes:
  sit-console-data:
  sandbench-logs:
  sit-console-db-data:
  test-engine-evidence:
